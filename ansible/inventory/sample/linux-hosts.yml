---
# Sample Linux inventory for the SentraOps runner installer.
#
# The executor's claim response populates the per-host vars
# at run time. Operators hand-edit this file (or generate it
# from their CMDB / config-management source) to declare:
#   1. Each host's ansible_host (the address Ansible dials).
#   2. Per-host settings (sudo rules, ssh user).
#
# Per the design doc §14.7: SSH with verified host keys.
# ansible_host_key_checking defaults to True in ansible-core;
# we pin it explicitly in the playbook (and in the
# group_vars/all.yml) so a hostile operator can't silently
# turn it off.
all:
  vars:
    ansible_connection: ssh
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/ssh/ssh_known_hosts"
    ansible_become: true
    ansible_become_method: sudo
  children:
    linux_targets:
      hosts:
        # Standard sudo-enabled Linux host. The deployment
        # user must have either NOPASSWD sudo (preferred for
        # automation) or be in a sudoers file with
        # `ansible` passwordless sudo for the become step.
        linux-ubuntu-01:
          ansible_host: 10.0.3.10
          ansible_user: ansible
        # RHEL-family. Same deployment-user pattern; the
        # distro-specific package manager is irrelevant at
        # this layer (the runner ships as a static binary).
        linux-rhel-01:
          ansible_host: 10.0.3.20
          ansible_user: ansible
        # SELinux-enforcing host. The runner's systemd unit
        # sets NoNewPrivileges + ProtectSystem — the operator
        # needs to ensure SELinux policy allows the runner
        # to write its log under /var/log/sentraops-runner.
        linux-rhel-02:
          ansible_host: 10.0.3.21
          ansible_user: ansible
          # Use a sudoers entry with NOPASSWD if available.
          ansible_become_flags: "NOPASSWD:"
