---
# Default group_vars for Linux / SSH targets.
# Per design doc §14.7: SSH with verified host keys.
# host_key_checking is pinned here (and not left to ansible-core's
# default) so a hostile operator can't silently turn it off.
ansible_connection: ssh
ansible_host_key_checking: true
ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/ssh/ssh_known_hosts"
ansible_become: true
ansible_become_method: sudo
