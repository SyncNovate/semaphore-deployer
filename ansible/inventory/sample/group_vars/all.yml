---
# Default group_vars for the SentraOps runner installer.
#
# The executor's Run() sets these vars from the claim
# payload via env, NOT from inventory (so secrets don't
# leak into VCS). Inventory vars here are network-level
# defaults only.
#
# Operators override these per-host in
#   windows-hosts.yml              (Windows / WinRM targets)
#   linux-hosts.yml                (Linux / SSH targets)
# Plus, per-platform defaults live in:
#   group_vars/windows_targets.yml
#   group_vars/linux_targets.yml
---
# Retry policy for transient WinRM/SSH errors (network glitch).
ansible_retry_count: 3
ansible_retry_interval_seconds: 5
